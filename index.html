    // ============================================================
    // STATE & STORAGE
    // ============================================================
    const STORAGE_KEY = 'betraybuilder_progress_v1';
    let completed = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
    let currentView = 'home'; // home | stage | day
    let currentStage = null;
    let currentDay = null;
    let searchQuery = '';

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed]));
      updateProgressUI();
    }

    function toggleComplete(dayNum) {
      if (completed.has(dayNum)) completed.delete(dayNum);
      else completed.add(dayNum);
      saveProgress();
      render();
    }

    function resetProgress() {
      if (confirm('Barcha progress o\'chirilsinmi? Bu amalni qaytarib bo\'lmaydi.')) {
        completed.clear();
        saveProgress();
        render();
      }
    }

    function getStageProgress(stage) {
      const [start, end] = stage.range;
      let done = 0;
      for (let d = start; d <= end; d++) if (completed.has(d)) done++;
      return { done, total: end - start + 1, percent: Math.round((done / (end - start + 1)) * 100) };
    }

    function getOverallProgress() {
      const total = 90;
      const done = completed.size;
      return { done, total, percent: Math.round((done / total) * 100) };
    }

    function stageForDay(d) {
      return STAGES.find(s => d >= s.range[0] && d <= s.range[1]);
    }

    function getDay(d) {
      return DAYS.find(x => x.day === d);
    }

    function getNextIncomplete() {
      for (let i = 1; i <= 90; i++) if (!completed.has(i)) return i;
      return null;
    }

    // ============================================================
    // RENDER HELPERS
    // ============================================================
    function updateProgressUI() {
      const { done, total, percent } = getOverallProgress();
      document.getElementById('header-progress-text').textContent = `${done} / ${total}`;
      document.getElementById('header-progress-bar').style.width = percent + '%';
      document.getElementById('sidebar-percent').textContent = percent + '%';
      document.getElementById('sidebar-progress-bar').style.width = percent + '%';
    }

    function milestoneBadge(day) {
      const m = MILESTONES.find(x => x.day === day);
      if (!m) return '';
      const colors = {
        green: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30',
        yellow: 'bg-yellow-500/20 text-yellow-400 border-yellow-500/30',
        red: 'bg-red-500/20 text-red-400 border-red-500/30',
        purple: 'bg-purple-500/20 text-purple-400 border-purple-500/30',
        blue: 'bg-blue-500/20 text-blue-400 border-blue-500/30',
        orange: 'bg-orange-500/20 text-orange-400 border-orange-500/30',
        gold: 'bg-yellow-400/20 text-yellow-300 border-yellow-400/40'
      };
      return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-medium border ${colors[m.color] || colors.green}">
        ★ ${m.title}
      </span>`;
    }

          <button data-stage="${s.num}" class="stage-btn w-full text-left px-3 py-2.5 rounded-lg transition flex items-start gap-3

              </button>
            ` : '<div class="flex-1"></div>'}
            ${next ? `
              <button data-goto-day="${next}" class="goto-day flex-1 flex items-center justify-center gap-2 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-sm font-medium transition">
                Kun ${next}
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
              </button>
            ` : '<div class="flex-1"></div>'}
          </div>
        </div>
      `;
    }

    // ============================================================
    // MAIN RENDER
    // ============================================================
    function render() {
      updateProgressUI();
      renderSidebar();

      const content = document.getElementById('content');
      if (currentView === 'day' && currentDay) {
        content.innerHTML = renderDay(currentDay);
      } else if (currentView === 'stage' && currentStage) {
        content.innerHTML = renderStage(currentStage);
      } else {
        content.innerHTML = renderHome();
      }

      // Event bindings
      content.querySelectorAll('.goto-day').forEach(btn => {
        btn.addEventListener('click', () => {
          currentDay = +btn.dataset.gotoDay;
          currentView = 'day';
          currentStage = stageForDay(currentDay)?.num || null;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      content.querySelectorAll('.stage-card').forEach(btn => {
        btn.addEventListener('click', () => {
          currentStage = +btn.dataset.stage;
          currentView = 'stage';
          currentDay = null;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });

      const backHome = content.querySelector('#btn-back-home');
      if (backHome) backHome.addEventListener('click', () => {
        currentView = 'home';
        currentStage = null;
        currentDay = null;
        render();
      });

      const backStage = content.querySelector('#btn-back-stage');
      if (backStage) backStage.addEventListener('click', () => {
        if (currentStage) {
          currentView = 'stage';
          currentDay = null;
        } else {
          currentView = 'home';
        }
        render();
      });

      const toggleBtn = content.querySelector('#btn-toggle-complete');
      if (toggleBtn) toggleBtn.addEventListener('click', () => {
        toggleComplete(currentDay);
      });
    }

    // ============================================================
    // INIT
    // ============================================================
    document.getElementById('btn-reset').addEventListener('click', resetProgress);

    document.getElementById('search-input')?.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase().trim();
      // Simple: if number, go to day; else filter stages later if needed
      if (/^\d+$/.test(searchQuery)) {
        const num = +searchQuery;
        if (num >= 1 && num <= 90) {
          currentDay = num;
          currentView = 'day';
          currentStage = stageForDay(num)?.num;
          render();
        }
      }
    });

    // Mobile nav
    document.querySelectorAll('.mobile-nav').forEach(btn => {
      btn.addEventListener('click', () => {
        const view = btn.dataset.view;
        if (view === 'home') {
          currentView = 'home';
          currentStage = null;
          currentDay = null;
        } else if (view === 'stages') {
          // Show first incomplete stage or stage 1
          const next = getNextIncomplete();
          currentStage = next ? stageForDay(next)?.num : 1;
          currentView = 'stage';
          currentDay = null;
        } else if (view === 'progress') {
          currentView = 'home';
          currentStage = null;
          currentDay = null;
        }
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // Initial
    updateProgressUI();
    render();
  </script>
</body>
</html>
